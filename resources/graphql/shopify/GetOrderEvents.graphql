query GetOrderEvents($id: ID!, $after: String) {
  order(id: $id) {
    events(first: 250, sortKey: CREATED_AT, reverse: true, after: $after) {
      pageInfo { hasNextPage endCursor }
      edges {
        node {
          __typename
          id
          action
          appTitle
          createdAt
          message
          ... on BasicEvent {
            subjectId
            subjectType
          }
        }
      }
    }
  }
}
